services:
  # Static production builds served by unprivileged nginx (container port 8080).
  server:
    build:
      context: .
    ports:
      - "127.0.0.1:4200:8080"
    restart: unless-stopped

  admin:
    build:
      context: ../admin-teto-toys
    ports:
      - "127.0.0.1:4201:8080"
    restart: unless-stopped
