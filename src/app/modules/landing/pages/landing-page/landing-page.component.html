<div class="landing-container">
  <!-- Hero Section -->
  <app-page-hero [subtitle]="'landing.heroSubtitle' | translate">
    <span heroTitle
      >{{ 'landing.heroTitlePrefix' | translate }}
      <span style="color: var(--brand-green)">Teto Toys</span></span
    >

    <!-- rel="noopener noreferrer" since this opens in a new tab -->
    <a
      heroActions
      href="https://www.instagram.com/teto.toys/"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-2 mt-6 px-4 py-2.5 rounded-full text-sm font-semibold text-white no-underline border border-white/20 bg-white/5 backdrop-blur-sm [transition:var(--transition-smooth)] hover:bg-white/10 hover:border-white/40 hover:-translate-y-px"
    >
      <svg
        class="w-[18px] h-[18px] shrink-0"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"
        />
      </svg>
      {{ 'landing.followInstagram' | translate }}
    </a>
  </app-page-hero>

  <!-- Products Section -->
  <section class="main-content">
    <div class="section-header">
      <h2 class="section-title">{{ 'landing.featuredProducts' | translate }}</h2>
    </div>

    <!-- Controls Section: Tabs & Search -->
    <div class="controls-row">
      <div
        class="categories-tabs"
        role="tablist"
        [attr.aria-label]="'landing.categoriesLabel' | translate"
      >
        <button
          class="tab-btn"
          role="tab"
          [attr.aria-selected]="selectedCategory() === 'All'"
          [class.active]="selectedCategory() === 'All'"
          (click)="selectCategory('All')"
        >
          {{ 'landing.allCategory' | translate }}
        </button>
        @for (cat of categories(); track cat.id) {
          <button
            class="tab-btn"
            role="tab"
            [attr.aria-selected]="selectedCategory() === cat.id.toString()"
            [class.active]="selectedCategory() === cat.id.toString()"
            (click)="selectCategory(cat.id.toString())"
          >
            {{ cat.name }}
          </button>
        }
      </div>

      <div class="search-wrapper">
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          class="search-input"
          [attr.placeholder]="'landing.searchPlaceholder' | translate"
          [value]="searchQuery()"
          (input)="onSearchKeyup($event)"
        />
      </div>
    </div>

    <app-products-cards-list
      [products]="products()"
      [categoryMap]="categoryMap()"
      [favoriteIds]="favoriteIds()"
      [togglingFavoriteId]="togglingFavoriteId()"
      [isAuthenticated]="authService.isAuthenticated()"
      [isLoading]="isLoading()"
      [errorMessage]="errorMessage()"
      (viewDetails)="viewDetails($event)"
      (toggleFavorite)="toggleFavorite($event)"
      (retry)="loadProducts()"
    />
  </section>
</div>
